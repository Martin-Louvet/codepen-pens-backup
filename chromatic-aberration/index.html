<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromatic Aberration (direct uploads)</title>
<!-- Fork of https://codepen.io/lukemeyrick/pen/eYMvymP by https://codepen.io/lukemeyrick
     Adds direct uploads, a download button with export settings, separate zoom / aberration controls
     (Tweakpane), mirrored edge extension, and a canvas preview shared with the download.
     The code of this fork was generated by Claude Sonnet 5.5 (Anthropic). -->
<style>
body {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; gap: 1em; margin: 0; padding: 1em; box-sizing: border-box;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
canvas { display: block; border-radius: 1em; max-width: 100%; }
#pane { width: min(100%, 320px); }
#file { display: none; }
#note { margin: 0; min-height: 1.2em; max-width: 90vmin; font-size: 0.8em; color: #b00; text-align: center; }
</style>
</head>
<body>

<canvas id="view"></canvas>
<div id="pane"></div>
<p id="note"></p>
<input id="file" type="file" accept="image/*">

<script>
const $ = (id) => document.getElementById(id);
const view = $('view'), note = $('note');

const u = (id) => `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=2400&q=80`;
const CATS = ['1472491235688-bdc81a63246e', '1607242792481-37f27e1d74e1', '1560114928-40f1f1eb26a0',
  '1574144611937-0df059b5ef3e', '1494256997604-768d1f608cac', '1573865526739-10659fec78a5',
  '1581300134629-4c3a06a31948'].map(u);

const PRESETS = { 'red-blue': ['#ff0000', '#0000ff'], 'green-purple': ['#00ff87', '#5000ff'], 'yellow-pink': ['#ffff00', '#f700ff'] };
const DEFAULTS = { effect: true, zoom: 1, strength: 1, rotation: 3, blur: 2, preset: 'red-blue',
  color1: '#ff0000', color2: '#0000ff', limit: false, maxSide: 4096 };
const P = { ...DEFAULTS, url: '' };
const INFO = { output: '' };   // read-only line in the Export section

let img = null;        // HTMLImageElement, ImageBitmap or canvas
let tainted = false;   // image from a server without CORS: preview works, download doesn't
const size = (s) => [s.naturalWidth || s.width, s.naturalHeight || s.height];
const BLOCKED = "This image's server blocks downloads of the result. Upload the file instead to download it.";

// ---------- loading ----------
function loadUrl(src, withCors) {
  return new Promise((resolve, reject) => {
    const el = new Image();
    if (withCors) el.crossOrigin = 'anonymous';
    el.onload = () => resolve(el);
    el.onerror = reject;
    el.src = src;
  });
}

async function setFromUrl(src) {
  try { img = await loadUrl(src, true); tainted = false; }
  catch (_) { img = await loadUrl(src, false); tainted = true; }
  note.textContent = tainted ? BLOCKED : '';
  render();
}

function demoImage() {
  const c = document.createElement('canvas'); c.width = 1200; c.height = 800;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 1200, 800);
  g.addColorStop(0, '#1b1f3b'); g.addColorStop(1, '#3d2a54');
  x.fillStyle = g; x.fillRect(0, 0, 1200, 800);
  x.strokeStyle = '#ffffff'; x.lineWidth = 6;
  for (let i = 1; i < 6; i++) { x.beginPath(); x.moveTo(i * 200, 0); x.lineTo(i * 200, 800); x.stroke(); }
  x.fillStyle = '#ffd23f'; x.beginPath(); x.arc(380, 330, 190, 0, 7); x.fill();
  x.fillStyle = '#ff6b6b'; x.fillRect(640, 200, 330, 330);
  x.fillStyle = '#ffffff'; x.font = '700 120px system-ui, sans-serif'; x.fillText('Sample', 330, 700);
  return c;
}

// ---------- the effect (used by BOTH the preview and the download) ----------
// Mirror the image outwards by `pad` px on every side, so a rotated / blurred copy has
// real pixels beyond the frame instead of leaving empty wedges at the borders.
function extend(src, W, H, pad) {
  const c = document.createElement('canvas');
  c.width = W + 2 * pad; c.height = H + 2 * pad;
  const x = c.getContext('2d');
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
    x.save();
    x.translate(pad + i * W + (i ? W : 0), pad + j * H + (j ? H : 0));
    x.scale(i ? -1 : 1, j ? -1 : 1);
    x.drawImage(src, 0, 0, W, H);
    x.restore();
  }
  return c;
}

function draw(cv, W, H, refW) {
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  if (!P.effect) { ctx.drawImage(img, 0, 0, W, H); return; }

  // 1. the photo, zoomed from the centre (zoom 1 = no zoom)
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(P.zoom, P.zoom);
  ctx.drawImage(img, -W / 2, -H / 2, W, H);
  ctx.restore();

  // 2. two tinted, blurred, masked copies blended with hard-light (strength 0 = none)
  if (P.strength <= 0) return;
  const blurPx = P.blur * (W / refW);        // blur is defined at preview size, scaled for the export
  const opacity = Math.min(1, 0.5 * P.strength);
  const layerScale = Math.max(1, P.zoom);
  const theta = Math.abs(P.rotation) * Math.PI / 180;

  // how far the rotated copy must extend beyond the frame to cover it, plus room for the blur
  const needX = (W / 2) * Math.cos(theta) + (H / 2) * Math.sin(theta);
  const needY = (W / 2) * Math.sin(theta) + (H / 2) * Math.cos(theta);
  const pad = Math.min(Math.ceil(Math.max(needX / layerScale - W / 2, needY / layerScale - H / 2, 0) + 3 * blurPx + 2),
                       Math.min(W, H));
  const PW = W + 2 * pad, PH = H + 2 * pad;
  const ext = extend(img, W, H, pad);

  const layer = document.createElement('canvas'); layer.width = PW; layer.height = PH;
  const soft = document.createElement('canvas'); soft.width = PW; soft.height = PH;
  const l = layer.getContext('2d'), k = soft.getContext('2d');

  [[P.color1, 1], [P.color2, -1]].forEach(([colour, dir]) => {
    l.globalCompositeOperation = 'source-over';
    l.fillStyle = colour; l.fillRect(0, 0, PW, PH);
    l.globalCompositeOperation = 'screen';
    l.drawImage(ext, 0, 0);

    k.save();
    k.clearRect(0, 0, PW, PH);
    k.filter = `blur(${blurPx}px)`;
    k.drawImage(layer, 0, 0);
    k.filter = 'none';

    // radial mask (relative to the original frame): 70% x 70% ellipse, 33% opaque in the middle, opaque from 90%
    k.globalCompositeOperation = 'destination-in';
    k.translate(PW / 2, PH / 2); k.scale(W * 0.7, H * 0.7);
    const mask = k.createRadialGradient(0, 0, 0, 0, 0, 1);
    mask.addColorStop(0, 'rgba(0,0,0,0.333)');
    mask.addColorStop(0.333, 'rgba(0,0,0,0.333)');
    mask.addColorStop(0.9, 'rgba(0,0,0,1)');
    k.fillStyle = mask; k.fillRect(-4, -4, 8, 8);
    k.restore();

    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.globalCompositeOperation = 'hard-light';
    ctx.translate(W / 2, H / 2);
    ctx.rotate(dir * theta);
    ctx.scale(layerScale, layerScale);
    ctx.drawImage(soft, -PW / 2, -PH / 2);
    ctx.restore();
  });

  ext.width = layer.width = soft.width = 0; // release the memory right away
}

// ---------- preview ----------
function previewSize() {
  const [nw, nh] = size(img);
  const vmin = Math.min(innerWidth, innerHeight) / 100;
  const w = Math.min(90 * vmin, 70 * vmin * (nw / nh), nw);
  return [w, w * (nh / nw)];
}

// size of the downloaded PNG: the original size, unless "Limit size" is on (never upscaled)
function exportSize() {
  const [nw, nh] = size(img);
  const k = P.limit ? Math.min(1, P.maxSide / Math.max(nw, nh)) : 1;
  return [Math.max(1, Math.round(nw * k)), Math.max(1, Math.round(nh * k))];
}

let outputBinding = null;
function updateOutputInfo() {
  const [w, h] = exportSize();
  const text = `${w} × ${h} px`;
  if (INFO.output === text) return;   // only touch the panel when the text changed
  INFO.output = text;
  if (outputBinding) outputBinding.refresh();
}

let queued = false;
function render() {
  if (!img) return;
  updateOutputInfo();
  if (queued) return;
  queued = true;
  requestAnimationFrame(() => {
    queued = false;
    const [w, h] = previewSize();
    const dpr = window.devicePixelRatio || 1;
    draw(view, Math.round(w * dpr), Math.round(h * dpr), w);
    view.style.width = w + 'px';
    view.style.height = h + 'px';
  });
}
addEventListener('resize', render);

// ---------- actions ----------
async function loadFromField(value) {
  let url;
  try { url = new URL(value).href; } catch (_) { return; }
  try { await setFromUrl(url); } catch (_) { note.textContent = "Couldn't load that image."; }
}

async function moreCats(pane) {
  P.url = ''; if (pane) pane.refresh();
  try { await setFromUrl(CATS[Math.floor(Math.random() * CATS.length)]); }
  catch (_) { note.textContent = "Couldn't load an image from the internet here. Upload one instead."; }
}

$('file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    img = await createImageBitmap(file); // stays on your computer, nothing is hosted
    tainted = false; note.textContent = '';
    render();
  } catch (_) { note.textContent = "That file isn't an image this browser can open."; }
  e.target.value = '';
});

function download() {
  if (!img) return;
  try {
    const [w, h] = exportSize();
    const out = document.createElement('canvas');
    draw(out, w, h, previewSize()[0]);
    out.toBlob((blob) => {
      if (!blob) { note.textContent = 'Could not create the image (it may be too large for this browser).'; return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'chromatic-aberration.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  } catch (err) {
    note.textContent = err && err.name === 'SecurityError' ? BLOCKED
      : 'Export failed (the image may be too large for this browser). Try "Limit size" in the Export section.';
  }
}

// ---------- Tweakpane ----------
import('https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js').then(({ Pane }) => {
  const pane = new Pane({ container: $('pane'), title: 'Chromatic aberration' });

  const image = pane.addFolder({ title: 'Image' });
  image.addBinding(P, 'url', { label: 'URL' }).on('change', (ev) => loadFromField(ev.value));
  image.addButton({ title: 'Upload from computer 📁' }).on('click', () => $('file').click());
  image.addButton({ title: 'Sample images' }).on('click', () => moreCats(pane));

  pane.addBinding(P, 'effect', { label: 'Show effect' });

  const zoom = pane.addFolder({ title: 'Zoom' });
  zoom.addBinding(P, 'zoom', { label: 'Strength', min: 1, max: 1.5, step: 0.01 });

  const ab = pane.addFolder({ title: 'Aberration' });
  ab.addBinding(P, 'strength', { label: 'Strength', min: 0, max: 2, step: 0.01 });
  ab.addBinding(P, 'rotation', { label: 'Rotation (°)', min: 0, max: 8, step: 0.1 });
  ab.addBinding(P, 'blur', { label: 'Blur (px)', min: 0, max: 10, step: 0.1 });

  // Presets write the two colours; the colours switch the preset to "Custom" only when YOU change them.
  // (pane.refresh() can report the colours as changed, so ignore that while a preset is being applied
  //  and ignore any colour pair that still matches the selected preset.)
  let syncing = false;
  const matchesPreset = () => {
    const c = PRESETS[P.preset];
    return !!c && c[0].toLowerCase() === String(P.color1).toLowerCase() && c[1].toLowerCase() === String(P.color2).toLowerCase();
  };
  const refreshPane = () => { syncing = true; try { pane.refresh(); } finally { syncing = false; } };

  ab.addBinding(P, 'preset', { label: 'Preset', options: {
    'Red, Blue': 'red-blue', 'Green, Purple': 'green-purple', 'Yellow, Pink': 'yellow-pink', 'Custom': 'custom' } })
    .on('change', (ev) => {
      if (syncing || ev.value === 'custom') return;
      [P.color1, P.color2] = PRESETS[ev.value];
      refreshPane();
    });
  const toCustom = () => {
    if (syncing || matchesPreset() || P.preset === 'custom') return;
    P.preset = 'custom';
    refreshPane();
  };
  ab.addBinding(P, 'color1', { label: 'Colour 1' }).on('change', toCustom);
  ab.addBinding(P, 'color2', { label: 'Colour 2' }).on('change', toCustom);

  const exp = pane.addFolder({ title: 'Export' });
  exp.addBinding(P, 'limit', { label: 'Limit size' });
  const maxSide = exp.addBinding(P, 'maxSide', { label: 'Max side (px)', min: 16, max: 16384, step: 1 });
  outputBinding = exp.addBinding(INFO, 'output', { label: 'Output size', readonly: true });
  exp.addButton({ title: 'Download PNG ⬇️' }).on('click', download);

  pane.addButton({ title: 'Reset all parameters' }).on('click', () => {
    Object.assign(P, DEFAULTS);
    refreshPane();
    maxSide.disabled = !P.limit;
    render();
  });

  pane.on('change', () => { maxSide.disabled = !P.limit; render(); });
  maxSide.disabled = !P.limit;
  if (img) updateOutputInfo();
}, () => {
  note.textContent = 'Controls could not be loaded (Tweakpane). The default settings are shown.';
});

// ---------- start ----------
setFromUrl(CATS[6]).catch(() => {
  img = demoImage(); tainted = false;
  note.textContent = 'Sample image shown (the default photo could not be loaded here).';
  render();
});
</script>
</body>
</html>
