<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Pop filter</title>
<!-- Inspired by the "cyber pop" look of a Polarr filter (by @LALAYOR, seen on Pinterest).
     Implemented from scratch as: tone curve -> posterize -> gradient map (no code from Polarr).
     The code of this tool was generated by Claude Sonnet 5.5 (Anthropic). -->
<style>
body {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; gap: 1em; margin: 0; padding: 1em; box-sizing: border-box;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
canvas { display: block; border-radius: 1em; max-width: 100%; }
#pane { width: min(100%, 320px); }
#file { display: none; }
#note { margin: 0; min-height: 1.2em; max-width: 90vmin; font-size: 0.8em; color: #b00; text-align: center; }
</style>
</head>
<body>

<canvas id="view"></canvas>
<div id="pane"></div>
<p id="note"></p>
<input id="file" type="file" accept="image/*">

<script>
const $ = (id) => document.getElementById(id);
const view = $('view'), note = $('note');

const u = (id) => `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=2400&q=80`;
const CATS = ['1472491235688-bdc81a63246e', '1607242792481-37f27e1d74e1', '1560114928-40f1f1eb26a0',
  '1574144611937-0df059b5ef3e', '1494256997604-768d1f608cac', '1573865526739-10659fec78a5',
  '1581300134629-4c3a06a31948'].map(u);

// four colours, from the darkest tones to the lightest
const PRESETS = {
  'cyber-pop': ['#10001a', '#d22ee6', '#8c9cf4', '#f1edff'],
  'sunset':    ['#14002e', '#e8264f', '#ff9a3c', '#fff3c4'],
  'acid':      ['#001a14', '#18c26a', '#d6f23a', '#fffde0'],
  'ice':       ['#050a1f', '#2b4fd8', '#6fd0ff', '#f4fbff'],
};
const DEFAULTS = { effect: true, mix: 0, brightness: -0.12, contrast: 1.4, clarity: 1.4, radius: 16, smooth: 0, levels: 6, softness: 0.4,
  preset: 'cyber-pop', color1: PRESETS['cyber-pop'][0], color2: PRESETS['cyber-pop'][1],
  color3: PRESETS['cyber-pop'][2], color4: PRESETS['cyber-pop'][3], limit: false, maxSide: 4096 };
const P = { ...DEFAULTS, url: '' };
const INFO = { output: '' };   // read-only line in the Export section

let img = null;        // HTMLImageElement, ImageBitmap or canvas
const size = (s) => [s.naturalWidth || s.width, s.naturalHeight || s.height];
const BLOCKED = "This image's server doesn't allow it to be processed. Save the image and use Upload instead.";

// ---------- loading ----------
function loadUrl(src) {
  return new Promise((resolve, reject) => {
    const el = new Image();
    el.crossOrigin = 'anonymous'; // needed to read the pixels
    el.onload = () => resolve(el);
    el.onerror = reject;
    el.src = src;
  });
}

async function setFromUrl(src) {
  img = await loadUrl(src);
  note.textContent = '';
  render();
}

function demoImage() {
  const c = document.createElement('canvas'); c.width = 1200; c.height = 800;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 1200, 800);
  g.addColorStop(0, '#f2d9c4'); g.addColorStop(0.5, '#8a6a9c'); g.addColorStop(1, '#1b1f3b');
  x.fillStyle = g; x.fillRect(0, 0, 1200, 800);
  const r = x.createRadialGradient(480, 330, 20, 480, 330, 260);
  r.addColorStop(0, '#fff2cf'); r.addColorStop(1, '#d9774a');
  x.fillStyle = r; x.beginPath(); x.arc(480, 330, 230, 0, 7); x.fill();
  x.fillStyle = '#2d2a4a'; x.fillRect(760, 160, 280, 420);
  x.fillStyle = '#ffffff'; x.font = '700 120px system-ui, sans-serif'; x.fillText('Sample', 330, 720);
  return c;
}

// ---------- the effect (used by BOTH the preview and the download) ----------
// any CSS colour -> [r, g, b]
const probe = document.createElement('canvas'); probe.width = probe.height = 1;
const pctx = probe.getContext('2d', { willReadFrequently: true });
function parseColor(c) {
  pctx.clearRect(0, 0, 1, 1); pctx.fillStyle = '#000'; pctx.fillStyle = c; pctx.fillRect(0, 0, 1, 1);
  const d = pctx.getImageData(0, 0, 1, 1).data; return [d[0], d[1], d[2]];
}

// cut x (0..1) into N tone bands; softness 0 = hard steps, 1 = no steps at all
function posterize(x, N, s) {
  const v = x * (N - 1), i = Math.min(N - 2, Math.floor(v)), f = v - i;
  let w;
  if (s <= 0) w = f >= 0.5 ? 1 : 0;
  else { w = Math.min(1, Math.max(0, (f - (0.5 - s / 2)) / s)); w = w * w * (3 - 2 * w); }
  return (i + w) / (N - 1);
}

// brightness 0..255 -> colour, for the current settings
function buildLut() {
  const stops = [P.color1, P.color2, P.color3, P.color4].map(parseColor);
  const N = Math.max(2, Math.round(P.levels));
  const lut = new Float32Array(256 * 3);
  for (let i = 0; i < 256; i++) {
    const x = Math.min(1, Math.max(0, (i / 255 - 0.5) * P.contrast + 0.5 + P.brightness));
    const g = posterize(x, N, P.softness) * 3, k = Math.min(2, Math.floor(g)), f = g - k;
    for (let c = 0; c < 3; c++) lut[i * 3 + c] = stops[k][c] + (stops[k + 1][c] - stops[k][c]) * f;
  }
  return lut;
}

// mirror the image outwards by `pad` px so blurring doesn't fade the borders
function extend(src, W, H, pad) {
  const c = document.createElement('canvas');
  c.width = W + 2 * pad; c.height = H + 2 * pad;
  const x = c.getContext('2d');
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
    x.save();
    x.translate(pad + i * W + (i ? W : 0), pad + j * H + (j ? H : 0));
    x.scale(i ? -1 : 1, j ? -1 : 1);
    x.drawImage(src, 0, 0, W, H);
    x.restore();
  }
  return c;
}

function draw(cv, W, H, refW) {
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  if (!P.effect) { ctx.drawImage(img, 0, 0, W, H); return; }

  // 1. light smoothing first, so the tone bands come out clean (blur is defined at preview size)
  const blurPx = P.smooth * (W / refW);
  if (blurPx > 0.05) {
    const pad = Math.min(Math.ceil(3 * blurPx + 2), Math.min(W, H));
    const ext = extend(img, W, H, pad);
    const soft = document.createElement('canvas'); soft.width = ext.width; soft.height = ext.height;
    const k = soft.getContext('2d');
    k.filter = `blur(${blurPx}px)`;
    k.drawImage(ext, 0, 0);
    ctx.drawImage(soft, -pad, -pad);
    ext.width = soft.width = 0;
  } else {
    ctx.drawImage(img, 0, 0, W, H);
  }

  // 2. local contrast ("clarity"): push each pixel away from a heavily blurred copy of the image
  const data = ctx.getImageData(0, 0, W, H), a = data.data;
  let big = null;
  if (P.clarity > 0) {
    const R = Math.max(0.5, P.radius * (W / refW));
    const pad = Math.min(Math.ceil(3 * R + 2), Math.min(W, H));
    const ext = extend(img, W, H, pad);
    const soft = document.createElement('canvas'); soft.width = ext.width; soft.height = ext.height;
    const k = soft.getContext('2d');
    k.filter = `blur(${R}px)`;
    k.drawImage(ext, 0, 0);
    const c2 = document.createElement('canvas'); c2.width = W; c2.height = H;
    const x2 = c2.getContext('2d', { willReadFrequently: true });
    x2.drawImage(soft, -pad, -pad);
    big = x2.getImageData(0, 0, W, H).data;
    ext.width = soft.width = c2.width = 0;
  }

  // 3. brightness -> tone curve -> bands -> colour ramp, pixel by pixel
  const lut = buildLut(), m = P.mix, cl = P.clarity;
  for (let i = 0; i < a.length; i += 4) {
    let l = (a[i] * 54 + a[i + 1] * 183 + a[i + 2] * 19) / 256;
    if (big) l += cl * (l - (big[i] * 54 + big[i + 1] * 183 + big[i + 2] * 19) / 256);
    const j = (l < 0 ? 0 : l > 255 ? 255 : (l + 0.5) | 0) * 3;
    if (m > 0) {
      a[i] = lut[j] + (a[i] - lut[j]) * m;
      a[i + 1] = lut[j + 1] + (a[i + 1] - lut[j + 1]) * m;
      a[i + 2] = lut[j + 2] + (a[i + 2] - lut[j + 2]) * m;
    } else {
      a[i] = lut[j]; a[i + 1] = lut[j + 1]; a[i + 2] = lut[j + 2];
    }
    a[i + 3] = 255;
  }
  ctx.putImageData(data, 0, 0);
}

// ---------- preview ----------
function previewSize() {
  const [nw, nh] = size(img);
  const vmin = Math.min(innerWidth, innerHeight) / 100;
  const w = Math.min(90 * vmin, 70 * vmin * (nw / nh), nw);
  return [w, w * (nh / nw)];
}

// size of the downloaded PNG: the original size, unless "Limit size" is on (never upscaled)
function exportSize() {
  const [nw, nh] = size(img);
  const k = P.limit ? Math.min(1, P.maxSide / Math.max(nw, nh)) : 1;
  return [Math.max(1, Math.round(nw * k)), Math.max(1, Math.round(nh * k))];
}

let outputBinding = null;
function updateOutputInfo() {
  const [w, h] = exportSize();
  const text = `${w} × ${h} px`;
  if (INFO.output === text) return;   // only touch the panel when the text changed
  INFO.output = text;
  if (outputBinding) outputBinding.refresh();
}

let queued = false;
function render() {
  if (!img) return;
  updateOutputInfo();
  if (queued) return;
  queued = true;
  requestAnimationFrame(() => {
    queued = false;
    const [w, h] = previewSize();
    const dpr = window.devicePixelRatio || 1;
    try { draw(view, Math.round(w * dpr), Math.round(h * dpr), w); note.textContent = ''; }
    catch (err) { note.textContent = err && err.name === 'SecurityError' ? BLOCKED : 'Could not process this image.'; }
    view.style.width = w + 'px';
    view.style.height = h + 'px';
  });
}
addEventListener('resize', render);

// ---------- actions ----------
async function loadFromField(value) {
  let url;
  try { url = new URL(value).href; } catch (_) { return; }
  try { await setFromUrl(url); } catch (_) { note.textContent = "Couldn't load that image (or its server doesn't allow it to be processed)."; }
}

async function sampleImage(pane) {
  P.url = ''; if (pane) pane.refresh();
  try { await setFromUrl(CATS[Math.floor(Math.random() * CATS.length)]); }
  catch (_) { note.textContent = "Couldn't load an image from the internet here. Upload one instead."; }
}

$('file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    img = await createImageBitmap(file); // stays on your computer, nothing is hosted
    note.textContent = '';
    render();
  } catch (_) { note.textContent = "That file isn't an image this browser can open."; }
  e.target.value = '';
});

function download() {
  if (!img) return;
  try {
    const [w, h] = exportSize();
    const out = document.createElement('canvas');
    draw(out, w, h, previewSize()[0]);
    out.toBlob((blob) => {
      if (!blob) { note.textContent = 'Could not create the image (it may be too large for this browser).'; return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'cyber-pop.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  } catch (err) {
    note.textContent = err && err.name === 'SecurityError' ? BLOCKED
      : 'Export failed (the image may be too large for this browser). Try "Limit size" in the Export section.';
  }
}

// ---------- Tweakpane ----------
import('https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js').then(({ Pane }) => {
  const pane = new Pane({ container: $('pane'), title: 'Cyber pop' });

  const image = pane.addFolder({ title: 'Image' });
  image.addBinding(P, 'url', { label: 'URL' }).on('change', (ev) => loadFromField(ev.value));
  image.addButton({ title: 'Upload from computer 📁' }).on('click', () => $('file').click());
  image.addButton({ title: 'Sample images' }).on('click', () => sampleImage(pane));

  pane.addBinding(P, 'effect', { label: 'Show effect' });
  pane.addBinding(P, 'mix', { label: 'Keep original', min: 0, max: 1, step: 0.01 });

  const tone = pane.addFolder({ title: 'Tone' });
  tone.addBinding(P, 'brightness', { label: 'Brightness', min: -0.5, max: 0.5, step: 0.01 });
  tone.addBinding(P, 'contrast', { label: 'Contrast', min: 0.5, max: 4, step: 0.05 });
  tone.addBinding(P, 'clarity', { label: 'Local contrast', min: 0, max: 3, step: 0.05 });
  tone.addBinding(P, 'radius', { label: 'Detail size (px)', min: 2, max: 80, step: 1 });
  tone.addBinding(P, 'smooth', { label: 'Smoothing (px)', min: 0, max: 1, step: 0.01 });

  const post = pane.addFolder({ title: 'Posterize' });
  post.addBinding(P, 'levels', { label: 'Tone bands', min: 2, max: 12, step: 1 });
  post.addBinding(P, 'softness', { label: 'Edge softness', min: 0, max: 1, step: 0.01 });

  // Presets write the four colours; a colour switches the preset to "Custom" only when YOU change it.
  // (pane.refresh() can report the colours as changed, so ignore that while a preset is being applied
  //  and ignore any colour set that still matches the selected preset.)
  const col = pane.addFolder({ title: 'Colours' });
  let syncing = false;
  const KEYS = ['color1', 'color2', 'color3', 'color4'];
  const matchesPreset = () => {
    const c = PRESETS[P.preset];
    return !!c && KEYS.every((k, i) => String(P[k]).toLowerCase() === c[i].toLowerCase());
  };
  const refreshPane = () => { syncing = true; try { pane.refresh(); } finally { syncing = false; } };

  col.addBinding(P, 'preset', { label: 'Preset', options: {
    'Cyber pop': 'cyber-pop', 'Sunset': 'sunset', 'Acid': 'acid', 'Ice': 'ice', 'Custom': 'custom' } })
    .on('change', (ev) => {
      if (syncing || ev.value === 'custom') return;
      KEYS.forEach((k, i) => { P[k] = PRESETS[ev.value][i]; });
      refreshPane();
    });
  const toCustom = () => {
    if (syncing || matchesPreset() || P.preset === 'custom') return;
    P.preset = 'custom';
    refreshPane();
  };
  col.addBinding(P, 'color1', { label: 'Shadows' }).on('change', toCustom);
  col.addBinding(P, 'color2', { label: 'Dark mids' }).on('change', toCustom);
  col.addBinding(P, 'color3', { label: 'Light mids' }).on('change', toCustom);
  col.addBinding(P, 'color4', { label: 'Highlights' }).on('change', toCustom);

  const exp = pane.addFolder({ title: 'Export' });
  exp.addBinding(P, 'limit', { label: 'Limit size' });
  const maxSide = exp.addBinding(P, 'maxSide', { label: 'Max side (px)', min: 16, max: 16384, step: 1 });
  outputBinding = exp.addBinding(INFO, 'output', { label: 'Output size', readonly: true });
  exp.addButton({ title: 'Download PNG ⬇️' }).on('click', download);

  pane.addButton({ title: 'Reset all parameters' }).on('click', () => {
    Object.assign(P, DEFAULTS);
    refreshPane();
    maxSide.disabled = !P.limit;
    render();
  });

  pane.on('change', () => { maxSide.disabled = !P.limit; render(); });
  maxSide.disabled = !P.limit;
  if (img) updateOutputInfo();
}, () => {
  note.textContent = 'Controls could not be loaded (Tweakpane). The default settings are shown.';
});

// ---------- start ----------
setFromUrl(CATS[6]).catch(() => {
  img = demoImage();
  note.textContent = 'Sample image shown (the default photo could not be loaded here).';
  render();
});
</script>
</body>
</html>
